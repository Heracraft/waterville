[[source]]
id = "astm-e1465-08"
title = "ASTM E1465-08. Radon Control Options for New Low-Rise Residential Buildings"
url = "https://maineindoorair.org/wp-content/uploads/2023/02/ASTM-E1465-08-Reprint.pdf"
kind = "model_code"
tier = "reference"
summary = """ASTM E1465-08 is the standard practice for radon control options in the design and construction of new low-rise residential buildings. Maine's residential building code amendments (16-642 CMR ch. 5, Section R301.2.5) require a radon control system built to ASTM E1465-08 in new one- and two-family dwellings and townhouses, and the mechanical code amendments (ch. 7) incorporate it by reference in place of IMC Section 512."""
note = "reprint hosted by a third party; treat as reference only"
