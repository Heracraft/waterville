# ---------------------------------------------------------------- Copyrighted model codes and standards
# Maine adopts these through MUBEC (16-642 CMR, above), but the text belongs
# to ICC, IAPMO, ASHRAE and ASTM. Their sites offer read-only viewers and
# forbid copying, so the index gets a stub per code: what it covers, which
# MUBEC chapter adopts it, and the link. Full text needs a license (ask the
# city whether it has ICC Digital Codes Premium).

[[source]]
id = "icc-irc-2021"
title = "2021 International Residential Code (IRC)"
url = "https://codes.iccsafe.org/content/IRC2021V3.0"
kind = "model_code"
tier = "reference"
summary = """The 2021 International Residential Code (IRC), published by the International Code Council, governs construction of detached one- and two-family dwellings and townhouses. Maine adopts it as part of the Maine Uniform Building and Energy Code (MUBEC), with Maine amendments in 16-642 CMR ch. 5. Those amendments require a radon control system built to ASTM E1465-08 in new one- and two-family dwellings and townhouses, and replace references to the International Plumbing Code with the State of Maine Plumbing Code."""

[[source]]
id = "icc-ibc-2021"
title = "2021 International Building Code (IBC)"
url = "https://codes.iccsafe.org/content/IBC2021V2.0"
kind = "model_code"
tier = "reference"
summary = """The 2021 International Building Code (IBC), published by the International Code Council, governs construction of buildings other than one- and two-family dwellings and townhouses (commercial, multifamily and institutional buildings). Maine adopts it as the Commercial Building Code of Maine, part of the Maine Uniform Building and Energy Code (MUBEC), with Maine amendments in 16-642 CMR ch. 3."""

[[source]]
id = "icc-iebc-2021"
title = "2021 International Existing Building Code (IEBC)"
url = "https://codes.iccsafe.org/content/IEBC2021V2.0"
kind = "model_code"
tier = "reference"
summary = """The 2021 International Existing Building Code (IEBC), published by the International Code Council, governs repair, alteration, change of occupancy, addition to and relocation of existing buildings. Maine adopts it as part of the Maine Uniform Building and Energy Code (MUBEC), with Maine amendments in 16-642 CMR ch. 4."""

[[source]]
id = "icc-iecc-2021"
title = "2021 International Energy Conservation Code (IECC)"
url = "https://codes.iccsafe.org/content/IECC2021V3.0"
kind = "model_code"
tier = "reference"
summary = """The 2021 International Energy Conservation Code (IECC), published by the International Code Council, sets minimum energy efficiency requirements for residential and commercial buildings: insulation, windows, air leakage, mechanical systems and lighting. Maine adopts it as the Energy Code component of the Maine Uniform Building and Energy Code (MUBEC), with Maine amendments in 16-642 CMR ch. 6. The Maine Department of Energy Resources also publishes a 2021 Stretch Code that goes beyond the IECC."""

[[source]]
id = "icc-imc-2021"
title = "2021 International Mechanical Code (IMC)"
url = "https://codes.iccsafe.org/content/IMC2021V4.0"
kind = "model_code"
tier = "reference"
summary = """The 2021 International Mechanical Code (IMC), published by the International Code Council, governs heating, ventilation, air conditioning and exhaust systems. Maine adopts it as the Mechanical Code component of the Maine Uniform Building and Energy Code (MUBEC), with Maine amendments in 16-642 CMR ch. 7. Those amendments defer to the Maine Fuel Board Rules and the Maine State Plumbing Code where they apply."""

[[source]]
id = "iapmo-upc-2021"
title = "2021 Uniform Plumbing Code (UPC)"
url = "https://epubs.iapmo.org/2021/UPC/"
kind = "model_code"
tier = "reference"
summary = """The 2021 Uniform Plumbing Code (UPC), published by the International Association of Plumbing and Mechanical Officials (IAPMO), is a model plumbing code. Maine's building code (MUBEC, 16-642 CMR chs. 5 and 7) does not use the International Plumbing Code; it defers plumbing to the Maine State Plumbing Code adopted under Title 32 by the state's plumbing board."""

[[source]]
