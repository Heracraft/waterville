kind = "model_code"
tier = "reference"
summary = """ANSI/ASHRAE Standard 62.1-2019 sets minimum ventilation rates and indoor air quality requirements for buildings other than low-rise residential. Maine incorporates it by reference in the Maine Uniform Building and Energy Code (MUBEC) mechanical code, 16-642 CMR ch. 7, and the commercial building code amendments in ch. 3 refer to it."""
