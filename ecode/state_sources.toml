# Non-eCode sources for the corpus, from the 2026-09-29 project kickoff email
# ("Today's Kickoff, Resources, & Received Material"). URLs were unwrapped from
# urldefense and re-pointed where maine.gov moved the file.
#
# tier = "ingest"     public-domain state law, rules or guidance; full text goes in the index
# tier = "reference"  copyrighted model codes; index the `summary` below as a stub that links to the code
# tier = "skip"       not usable (dead, unauthorized copy, duplicate)
# tier = "superseded" replaced by a renumbered or newer entry; kept for the record, not ingested
# tier = "listing"    a City web page whose linked forms are checked against the city_form entries
#
# kind = "statute" | "rule" | "court_rule" | "guidance" | "model_code" | "city_form"
# (ecode/state.py maps each kind to a source_type and a header line)
#
# The nine ecode360.com links in the email (Chapters 103, 127, 145, 150, 180,
# 205, 232, 244, 275) are already in the eCode crawl, so they are not listed here.

