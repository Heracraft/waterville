<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waterville Codes RAG</title>
<meta name="description" content="Search and ask questions about the Code of the City of Waterville, Maine.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23032c3c'/%3E%3Cpath d='M0 7.5H32M7.5 0V32' stroke='%23e1dcd8' stroke-width='1'/%3E%3Ctext x='19.5' y='26' font-size='19' font-family='Georgia,serif' fill='%23e6c5b8' text-anchor='middle'%3E%C2%A7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="/style.css">
<script>
  // Apply the saved theme before first paint.
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<header class="site">
  <div class="wrap">
    <div class="meta">
      <span>City of Waterville, Maine</span>
      <span class="meta-actions">
      <button type="button" id="clear-chat" class="theme-toggle" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2.5v3h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>New chat</span>
      </button>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">
        <svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span class="label">Light</span>
      </button>
      </span>
    </div>
    <h1>Waterville Codes RAG</h1>
    <!-- <p class="lede">Questions about ordinances, permits, zoning and fees in Waterville, Maine, and the state laws and building rules that apply. Answers cite the sections they come from.</p> -->
  </div>
</header>

<main class="wrap">
  <section id="intro" aria-label="Example questions">
    <p class="hint">Try one of these</p>
    <div class="examples">
      <button type="button">How tall can a fence be in a residential zone?</button>
      <button type="button">What does a short-term rental license cost?</button>
      <button type="button">Can I keep chickens in my backyard?</button>
      <button type="button">Are consumer fireworks allowed in Waterville?</button>
    </div>
  </section>

  <ol id="thread" aria-live="polite"></ol>

  <form id="ask" autocomplete="off">
    <label for="q" class="sr-only">Your question</label>
    <textarea id="q" rows="1" maxlength="1000" placeholder="Ask about the City Code..." required></textarea>
    <button type="submit" id="send">Ask</button>
  </form>
</main>

<div id="panel-backdrop" class="panel-backdrop" hidden></div>
<aside id="panel" class="panel" role="complementary" aria-label="Source text" hidden>
  <div class="panel-head">
    <div class="panel-id">
      <h2 id="panel-title" tabindex="-1">Source</h2>
      <div id="panel-meta" class="panel-meta"></div>
    </div>
    <button type="button" class="panel-close" aria-label="Close source">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3.5 3.5l9 9m0-9l-9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>
  <div id="panel-scroll" class="panel-scroll">
    <div id="panel-claim" class="panel-claim" hidden></div>
    <p id="panel-note" class="panel-note" hidden></p>
    <div id="panel-body" class="panel-body"></div>
  </div>
  <div class="panel-foot"><a id="panel-open" target="_blank" rel="noopener">Open original</a></div>
</aside>
<script src="/source.js"></script>
<script src="/app.js"></script>
<script src="/scroll.js"></script>
<script src="/theme.js"></script>
</body>
</html>
