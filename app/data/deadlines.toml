[[rule]]
id = "zba-reconsider-45"
triggers = ["zba-decision", "zba-grant", "zba-denial"]
label = "Last day for the ZBA to vote and act on reconsideration"
actor = "City (ZBA)"
kind = "deadline"
amount = 45
unit = "days"
direction = "after"
convention = "city_calendar"
citation = "30-A M.R.S. § 2691(3)(F); Waterville City Code § 275-6.2E(4)(i)[4]"
url = "https://legislature.maine.gov/statutes/30-A/title30-Asec2691.html"
source = "https://legislature.maine.gov/statutes/30-A/title30-Asec2691.html"
quote = '''A vote to reconsider and the action taken on that reconsideration must occur and be completed within 45 days of the date of the vote on the original decision.'''
