# Legal clocks for the deadline calculator (B7), read by app/routers/deadlines.py.
#
# Every rule names its trigger event, its offset, how the days are counted,
# the controlling citation, where the text came from and a verbatim quote of
# that text. `verified = true` means the quote was matched word for word
# against the primary source named in `source`:
#   - a path under output/markdown/code/ is the eCode360 crawl in this repo
#     (legislation through 08-05-2026); tests/test_deadlines.py re-checks
#     every one of those quotes against the file on each test run.
#   - a URL is a state primary source (legislature.maine.gov, courts.maine.gov,
#     maine.gov) or a City form. Those quotes were matched against the text
#     fetched on `checked`.
# `verified = false` means the clock could not be confirmed from primary text.
# The calculator still shows it, labeled "Unverified, check before relying".
#
# `applies = "check"` marks a clock whose text is verified but whose reach in
# Waterville is not settled (a state model ordinance, or a statute whose
# application to a Waterville permit is a question for the City Solicitor).
#
# Fields per rule:
#   id, triggers (event ids), label, actor, kind ("deadline": act by this date;
#   "lapse": a right or approval ends; "earliest": not before this date),
#   amount, unit ("days", "working_days", "hours", "months", "annual"),
#   direction ("after" or "before" the trigger), convention (see
#   [conventions]), citation, url, source, quote, verified, checked,
#   applies ("waterville" or "check"), caution, note, also (related text).
# Prose here follows the project's writing rules: no em dashes.

checked_default = "2026-10-03"

# ------------------------------------------------------------ conventions

[conventions.rule6a]
label = "Court rule 6(a)"
summary = "Day of the event not counted. If the last day is a Saturday, Sunday or Maine legal holiday, the period runs to the next day that is none of those. Periods under 7 days skip intermediate weekends and holidays."
citation = "M.R. Civ. P. 6(a)"
url = "https://courts.maine.gov/rules/text/mr_civ_p_only_2026-06-01.pdf"
quote = '''In computing any period of time prescribed or allowed by these rules, by order of court, or by any applicable statute, the day of the act, event, or default after which the designated period of time begins to run is not to be included. The last day of the period so computed is to be included, unless it is a Saturday, a Sunday, or a legal holiday, in which event the period runs until the end of the next day which is not a Saturday, a Sunday, or a holiday. When the period of time prescribed or allowed is less than 7 days, intermediate Saturdays, Sundays and legal holidays shall be excluded in the computation.'''
caution = "Court-ordered clerk's office closures also count as holidays under Rule 6(a). The calculator does not know about them."

[conventions.app1a]
label = "Appellate rule 1A"
summary = "Same as Rule 6(a): day of the event not counted, a last day on a weekend or Maine legal holiday rolls to the next court day. Periods of 6 days or fewer skip intermediate weekends and holidays."
citation = "M.R. App. P. 1A"
url = "https://www.courts.maine.gov/rules/text/mr_app_p_only_2024-11-01.pdf"
quote = '''In computing any period of time prescribed or allowed by these Rules, by order of court, or by any applicable statute, the day of the act, event, or default after which the designated period of time begins to run is not to be included. The last day of the period so computed is to be included, unless it is a Saturday, a Sunday, or a legal holiday, in which event the period runs until the end of the next day which is not a Saturday, a Sunday, or a legal holiday.'''
caution = "Court-ordered clerk's office closures also extend a deadline. The calculator does not know about them."

[conventions.city_calendar]
label = "City, calendar days"
summary = "Day of the event not counted; every calendar day after it counts. The City Code has no rule that moves a last day falling on a closed day, so the date stands. When City Hall is closed that day, the calculator also gives the last open day before it."
citation = "No counting rule in the City Code; Rule 6(a) style start"
caution = "Whether a filing due on a day City Hall is closed may be made on the next open day is a question for the City Solicitor. Plan on the last open day before."

[conventions.city_working_days]
label = "City working days"
summary = "Day of the event not counted. Counts only days City Hall is open: Monday to Thursday, less the City holidays of § 56-5.1. City Hall has been closed on Fridays since January 3, 2025."
citation = "Waterville City Code § 56-5.1; City Hall hours (Mon-Thu, 7:00 am to 5:30 pm)"
url = "https://ecode360.com/39780157"
source = "output/markdown/code/056-personnel.md"
quote = '''For employees working a four-day week: Unless designated as a Monday holiday, when a holiday falls on a Friday or Saturday, the employee will receive 10 hours of floating holiday leave (FHL) time. When it falls on a Sunday, the following Monday shall be observed.'''
caution = "The Code does not define \"working days\". The calculator counts City Hall open days and also shows the Monday to Friday count, which ends earlier."

[conventions.clock_hours]
label = "Clock hours"
summary = "Counted hour by hour from the time entered, weekends and holidays included."
citation = "Plain reading of the text"

[conventions.calendar_months]
label = "Calendar months"
summary = "\"Month\" means a calendar month. The clock ends on the same day number N months later; when that month is shorter (a January 31 start, or February 29 a year on), it ends on the month's last day."
citation = "1 M.R.S. § 72(11-C)"
url = "https://legislature.maine.gov/statutes/1/title1sec72.html"
quote = '''"Month" means a calendar month.'''
caution = "The month-end rule for short months is the calculator's convention. No Waterville or Maine text settles it."

[conventions.city_before]
label = "Days before an event"
summary = "\"At least N days before\": the event day is not counted, so the act is due N days before the event date. If that day City Hall is closed, the calculator moves it back to the last open day."

[conventions.annual]
label = "Fixed annual date"
summary = "A date set by the text, such as October 31 each year. The calculator gives the next one on or after the date entered."

# ------------------------------------------------------------ calendars

[calendar.court]
label = "Maine legal holidays (courts)"
citation = "4 M.R.S. § 1051"
url = "https://legislature.maine.gov/statutes/4/title4sec1051-1.html"
quote = '''Court may not be held on Sunday or any day designated for the annual Thanksgiving; New Year's Day, January 1st; Martin Luther King, Jr., Day, the 3rd Monday in January; Washington's Birthday, the 3rd Monday in February; Patriot's Day, the 3rd Monday in April; Memorial Day, the last Monday in May, but if the Federal Government designates May 30th as the date for observance of Memorial Day, the 30th of May; Juneteenth, June 19th; the 4th of July; Labor Day, the first Monday of September; Indigenous Peoples Day, the 2nd Monday in October; Veterans Day, November 11th; or on Christmas Day.'''
note = "A holiday that falls on a Sunday is observed the Monday after. Thanksgiving is taken as the fourth Thursday of November."

[calendar.city]
label = "City Hall closed days"
citation = "Waterville City Code § 56-5.1; City Hall hours"
url = "https://ecode360.com/39780157"
source = "output/markdown/code/056-personnel.md"
quote = '''When it falls on a Sunday, the following Monday shall be observed.'''
note = "City Hall is open Monday to Thursday, 7:00 am to 5:30 pm, and closed Fridays (four-day week since January 3, 2025, per the City's notice and website). Closed as well on the twelve holidays of § 56-5.1A, using the dates in 4 M.R.S. § 1051; a Sunday holiday closes the Monday after. A holiday on a Friday or Saturday does not move. Extra days granted under § 56-5.1E or F are not known to the calculator."

