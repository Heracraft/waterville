source = "output/markdown/code/275-zoning.md"
quote = '''Any such petition for reconsideration must be filed with the Chairman of the Zoning Board of Appeals within 10 working days of the Planning Board's receipt of the notice of the Zoning Board of Appeals' action on the variance application.'''
verified = true
note = "Only when the Planning Board made an advisory recommendation under § 275-6.2E(H)(6), and only on a majority vote at a public meeting (§ 275-6.2E(4)(i)[1])."

[[rule]]
id = "zba-reconsider-petition-notice-5wd"
