[[rule]]
id = "zba-80b-45"
triggers = ["zba-decision", "zba-grant", "zba-denial"]
label = "Appeal to Superior Court (Rule 80B)"
actor = "Any aggrieved party"
kind = "deadline"
amount = 45
unit = "days"
direction = "after"
convention = "rule6a"
citation = "Waterville City Code § 275-6.2F; 30-A M.R.S. § 2691(3)(G)"
url = "https://ecode360.com/38457665"
source = "output/markdown/code/275-zoning.md"
quote = '''Any person or persons or any taxpayer, board, department or bureau of the City aggrieved by any decision of the Zoning Board of Appeals on an original application must file an appeal in accordance with Rule 80B of the Maine Rules of Civil Procedure within 45 days of the decision.'''
verified = true
caution = "Under 30-A § 2691(3)(H), a ZBA decision is final only when the project has every required municipal approval; a denial is final at once. If another board reviews the project last, 30-A § 4482-A may govern the appeal period."

[[rule.also]]
citation = "30-A M.R.S. § 2691(3)(G)"
url = "https://legislature.maine.gov/statutes/30-A/title30-Asec2691.html"
quote = '''Any party may take an appeal, within 45 days of the date of the vote on the original decision, to Superior Court from any order, relief or denial in accordance with the Maine Rules of Civil Procedure, Rule 80B.'''

