# ------------------------------------------------------------ rules: court

[[rule]]
id = "80e-notice-24h"
triggers = ["80e-presentation"]
label = "Written notice to the owner or occupant of the warrant application"
actor = "City (applicant for the warrant)"
kind = "deadline"
amount = 24
unit = "hours"
direction = "before"
convention = "clock_hours"
citation = "M.R. Civ. P. 80E(b)(5)"
url = "https://courts.maine.gov/rules/text/mr_civ_p_only_2026-06-01.pdf"
source = "https://courts.maine.gov/rules/text/mr_civ_p_only_2026-06-01.pdf"
quote = '''That the applicant has at least 24 hours in advance of the presentation of the application given written notice to the owner or occupant of the premises to be inspected of the time and place at which the applicant intends to present the application to the court.'''
verified = true
note = "Rule 80E(b)(6) lets the court dispense with the notice when the application shows an immediate threat to health or safety."

[[rule]]
id = "80e-execute-10"
triggers = ["80e-warrant-issued"]
label = "Execute the inspection warrant (business hours)"
actor = "City (person named in the warrant)"
kind = "deadline"
amount = 10
unit = "days"
direction = "after"
convention = "rule6a"
citation = "M.R. Civ. P. 80E(e)"
url = "https://courts.maine.gov/rules/text/mr_civ_p_only_2026-06-01.pdf"
source = "https://courts.maine.gov/rules/text/mr_civ_p_only_2026-06-01.pdf"
quote = '''The person to whom a warrant is issued shall execute the same by conducting the inspection authorized during normal business hours within 10 days after issuance of the warrant.'''
verified = true
caution = "Rule 6(a) extends a last day that falls on a weekend or holiday, but the inspection itself must happen during normal business hours."

[[rule]]
id = "80e-return-10"
triggers = ["80e-executed"]
label = "File the return with the court"
actor = "City (person who executed the warrant)"
kind = "deadline"
amount = 10
unit = "days"
direction = "after"
convention = "rule6a"
citation = "M.R. Civ. P. 80E(f)"
url = "https://courts.maine.gov/rules/text/mr_civ_p_only_2026-06-01.pdf"
source = "https://courts.maine.gov/rules/text/mr_civ_p_only_2026-06-01.pdf"
quote = '''Not later than 10 days after execution of the warrant the person executing it shall file a return with the court from which the warrant issued setting forth the date and time of the inspection and any violations of law found upon the inspected premises.'''
verified = true

[[rule]]
id = "80k-appeal-21"
triggers = ["80k-judgment"]
label = "Notice of appeal from the District Court judgment"
actor = "Either party"
kind = "deadline"
amount = 21
unit = "days"
direction = "after"
convention = "app1a"
citation = "M.R. App. P. 2B(c)(1); M.R. Civ. P. 80K(j)"
url = "https://www.courts.maine.gov/rules/text/mr_app_p_only_2024-11-01.pdf"
source = "https://www.courts.maine.gov/rules/text/mr_app_p_only_2024-11-01.pdf"
quote = '''The time within which an appeal may be taken in a civil case shall be 21 days after entry into the docket of the judgment or order appealed from, unless a shorter time is provided by law.'''
verified = true
note = "Rule 80K itself sets no day counts: the defendant answers orally at the time and place on the citation, and appeals go \"as in other civil actions\" (Rule 80K(j))."

[[rule.also]]
citation = "M.R. Civ. P. 80K(j)"
url = "https://courts.maine.gov/rules/text/mr_civ_p_only_2026-06-01.pdf"
quote = '''A party entitled to appeal may do so as in other civil actions.'''

[[rule]]
id = "80b-default-30"
triggers = ["gov-action-notice"]
label = "Rule 80B complaint when no statute sets the period"
actor = "Any aggrieved party"
kind = "deadline"
amount = 30
unit = "days"
direction = "after"
convention = "rule6a"
citation = "M.R. Civ. P. 80B(b)"
url = "https://courts.maine.gov/rules/text/mr_civ_p_only_2026-06-01.pdf"
source = "https://courts.maine.gov/rules/text/mr_civ_p_only_2026-06-01.pdf"
quote = '''The time within which review may be sought shall be as provided by statute, except that if no time limit is specified by statute, the complaint shall be filed within 30 days after notice of any action or refusal to act of which review is sought unless the court enlarges the time in accordance with Rule 6(b)'''
verified = true
note = "ZBA decisions have their own 45-day statute (30-A § 2691(3)(G)). A written decision sent by mail counts as delivered on actual receipt or three days after mailing, whichever is earlier (Rule 80B(b))."
