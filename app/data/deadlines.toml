# ------------------------------------------------------------ rules: Zoning Board of Appeals

[[rule]]
id = "zba-admin-appeal-30"
triggers = ["ceo-decision"]
label = "Last day to appeal the CEO decision to the ZBA"
actor = "Any interested party"
kind = "deadline"
amount = 30
unit = "days"
direction = "after"
convention = "city_calendar"
citation = "Waterville City Code § 275-6.2E(1)"
url = "https://ecode360.com/38457665"
source = "output/markdown/code/275-zoning.md"
quote = '''All appeals shall be made by any interested party within 30 days of a decision rendered by the Code Enforcement Officer.'''
verified = true
note = "Under 30-A M.R.S. § 2691(4), a notice of violation or enforcement order is appealable to the ZBA unless an ordinance says otherwise."

[[rule]]
id = "zba-hearing-45"
triggers = ["zba-application-filed"]
label = "ZBA public hearing must be held by"
actor = "City (CEO schedules)"
kind = "deadline"
amount = 45
unit = "days"
direction = "after"
convention = "city_calendar"
citation = "Waterville City Code § 275-6.2H(3)"
url = "https://ecode360.com/38457665"
source = "output/markdown/code/275-zoning.md"
quote = '''The Code Enforcement Officer shall immediately schedule a public hearing to be held within 45 days of the filing of the application.'''
verified = true

[[rule]]
id = "zba-publication-14"
triggers = ["zba-hearing"]
label = "First newspaper publication of the hearing notice"
actor = "City"
kind = "deadline"
amount = 14
unit = "days"
direction = "before"
convention = "city_before"
citation = "Waterville City Code § 275-6.2H(4)"
url = "https://ecode360.com/38457665"
source = "output/markdown/code/275-zoning.md"
quote = '''Notice of the day, time and place of the hearing shall be given to the applicant and shall be published at least two times in a newspaper in general circulation in Waterville, the first publication to be not less than 14 days before the date of the hearing.'''
verified = true
note = "Check the newspaper's own deadline for placing the notice, which falls earlier."

[[rule]]
id = "zba-mailing-14"
triggers = ["zba-hearing"]
label = "Mail the notice to owners within 300 feet"
actor = "City (CEO)"
kind = "deadline"
amount = 14
unit = "days"
direction = "before"
convention = "city_before"
citation = "Waterville City Code § 275-6.2H(5)"
url = "https://ecode360.com/38457665"
source = "output/markdown/code/275-zoning.md"
quote = '''The Code Enforcement Officer shall send a copy of the notice by first class mail to the owners of all property within 300 feet of the property in question at least 14 days in advance of the hearing.'''
verified = true

[[rule]]
id = "zba-shoreland-dep-20"
triggers = ["zba-hearing"]
label = "Shoreland variance: application to Maine DEP"
actor = "City"
kind = "deadline"
amount = 20
unit = "days"
direction = "before"
convention = "city_before"
citation = "Waterville City Code § 275-6.2E(4)(c)"
url = "https://ecode360.com/38457665"
source = "output/markdown/code/275-zoning.md"
quote = '''Applications for variances within the shoreland zone must be submitted to Maine DEP 20 days before action is taken by the Zoning Board of Appeals.'''
verified = true
note = "Counted back from the hearing date on the assumption the Board acts that night. Only for variances in the shoreland zone."

[[rule]]
id = "zba-written-decision-7"
triggers = ["zba-decision", "zba-grant", "zba-denial"]
label = "Written notice of the decision to the applicant"
actor = "City (ZBA)"
kind = "deadline"
amount = 7
unit = "days"
direction = "after"
convention = "city_calendar"
citation = "Waterville City Code § 275-6.2H(12); 30-A M.R.S. § 2691(3)(E)"
url = "https://ecode360.com/38457665"
source = "output/markdown/code/275-zoning.md"
quote = '''The applicant shall be notified in writing of the finding and decision of the Board within seven days of the Board's decision, with copies sent to the Code Enforcement Officer and the municipal officers.'''
verified = true

[[rule.also]]
citation = "30-A M.R.S. § 2691(3)(E)"
url = "https://legislature.maine.gov/statutes/30-A/title30-Asec2691.html"
quote = '''Notice of any decision must be mailed or hand delivered to the petitioner, the petitioner's representative or agent, the planning board, agency or office and the municipal officers within 7 days of the board's decision.'''

[[rule]]
id = "zba-reconsider-request-10"
triggers = ["zba-decision", "zba-grant", "zba-denial"]
label = "Request to reconsider (any party)"
actor = "Any party"
kind = "deadline"
amount = 10
unit = "days"
direction = "after"
convention = "city_calendar"
citation = "30-A M.R.S. § 2691(3)(F); Waterville City Code § 275-6.2E(4)(i)[4]"
url = "https://legislature.maine.gov/statutes/30-A/title30-Asec2691.html"
source = "https://legislature.maine.gov/statutes/30-A/title30-Asec2691.html"
quote = '''A request to the board to reconsider a decision must be filed within 10 days of the decision that is to be reconsidered.'''
verified = true
note = "The state limit covers a request by any party. The City text sets the same 10 days for an applicant's request to reconsider a denial. After a variance grant, the Planning Board has its own clock (§ 275-6.2E(4)(i)[2]); pick \"Planning Board receives notice of a ZBA variance decision\" to see it."

[[rule.also]]
citation = "Waterville City Code § 275-6.2E(4)(i)[4]"
url = "https://ecode360.com/38457665"
source = "output/markdown/code/275-zoning.md"
quote = '''If the request is made by the applicant it must be filed within 10 days of the decision that is to be reconsidered.'''

[[rule]]
id = "pb-reconsider-petition-10wd"
triggers = ["pb-variance-notice-received"]
label = "Planning Board petition to reconsider a variance grant"
actor = "City (Planning Board)"
kind = "deadline"
