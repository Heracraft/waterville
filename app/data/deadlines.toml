# ------------------------------------------------------------ rules: rental registration

[[rule]]
id = "rental-transfer-60"
triggers = ["rental-transfer"]
label = "Register the rental building"
actor = "Owner or property manager"
kind = "deadline"
amount = 60
unit = "days"
direction = "after"
convention = "city_calendar"
citation = "Waterville City Code § 215-6A"
url = "https://ecode360.com/44573403"
source = "output/markdown/code/215-rental-housing-registration.md"
quote = '''Within 60 calendar days of purchasing or transferring the ownership of such a building or converting a building into a residential rental building, including through the addition of more units, the legal owner, or the property manager, is expected to register the building.'''
verified = true
note = "Chapter 215 is a voluntary registration (\"is expected to\")."

[[rule]]
id = "rental-new-30"
triggers = ["rental-co-issued"]
label = "Register the new rental building"
actor = "Owner or property manager"
kind = "deadline"
