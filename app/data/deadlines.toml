convention = "city_calendar"
citation = "Waterville City Code § 215-6B"
url = "https://ecode360.com/44573403"
source = "output/markdown/code/215-rental-housing-registration.md"
quote = '''Newly constructed residential rental buildings are expected to be registered within 30 calendar days of the date the City issues a certificate of occupancy.'''
verified = true

[[rule]]
