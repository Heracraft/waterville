# ------------------------------------------------------------------ triage (A2)
# Questions that must reach Code Enforcement or Fire, and questions the
# office does not handle. Shown as a card with the answer. Life safety wins
# when both match.

[[triage]]
id = "life_safety"
kind = "urgent"
title = "Report this to Code Enforcement or the Fire Department"
patterns = [
  '\bno heat\b',
  '\b(heat|heating|furnace|boiler)\b.{0,30}\b(off|out|broken|not working|doesn.t work|isn.t working|won.t)\b',
  '\bwithout heat\b',
  '\bsewage\b',
  '\bsewer\b.{0,20}\b(back|overflow|leak)',
  '\bseptic\b.{0,20}\b(back|overflow|fail)',
  '\b(collaps\w*|caving in|sagging|structural damage|structurally unsafe|unsafe structure)\b',
  '\bfire hazard\b',
  '\b(exposed|sparking|bare|unsafe) (wires|wiring)\b',
  '\bcarbon monoxide\b',
  '\bsmoke detectors?\b.{0,20}\b(missing|none|no|broken)\b',
  '\bno (smoke|co) (detectors?|alarms?)\b',
  '\b(blocked|locked) (exit|fire escape|egress)\b',
  '\bunsafe (building|house|apartment)\b',
  '\bno (running )?water\b',
  '\bmold\b',
  '\brats?\b|\bvermin\b|\bcockroach\w*\b',
]
lines = [
  "For danger to life right now (fire, gas smell, collapse), call 911.",
  "Unsafe or unsanitary conditions in a building, such as no heat, sewage, structural damage or a fire hazard, go to Code Enforcement at 207-680-4208. The Code Enforcement Officer and the Fire Chief can order an unsafe building vacated (§ 210-10).",
  "Property maintenance complaints are taken by appointment. You can prepare a printable complaint sheet to bring.",
]
links = [
  { label = "Prepare a complaint sheet", href = "/complaint" },
]

[[triage]]
id = "out_of_scope"
kind = "elsewhere"
title = "The Code Enforcement Office does not handle this"
patterns = [
  '\bevict\w*\b',
  '\bsecurity deposit\b',
  '\blease\b.{0,30}\b(break|terminate|end|rights?)\b',
  '\btenant.{0,10}rights?\b',
  '\b(rent|rental) (increase|raise)\b',
  '\bboundary (line )?dispute\b',
  '\bproperty line dispute\b',
  '\bencroach\w*\b',
  '\bsue\b|\blawsuit\b|\bsmall claims\b',
  '\bneighbor\w*\b.{0,40}\b(on my (land|property)|over the line)\b',
]
lines = [
  "The office does not give landlord-tenant or legal advice and does not handle civil or boundary disputes. For tenant rights, an attorney or a legal aid organization can help. For a boundary line, a licensed land surveyor can mark it, and an attorney can advise on a dispute.",
  "If a rental unit has unsafe conditions (no heat, sewage, structural damage, a fire hazard), that is a code matter: call Code Enforcement at 207-680-4208.",
]
links = []

