# ------------------------------------------------------------------ what to bring
# Mirrors the fields of the Building Permit Application, pages 1 to 3 and
# the site plan requirement on page 5.

[bring]
building = [
  "Map and lot number, lot size and zone (from the city's online tax map, or ask the office)",
  "Site location (street address)",
  "Owner, applicant and contractor names, addresses, phone numbers and email",
  "A short description of the scope of work",
  "Dimensions of the proposed structure",
  "Foundation type: full 8 ft, 5 ft frost wall, pier or slab",
  "Setbacks of existing and proposed structures: front, sides and rear",
  "Lot frontage and lot depth",
  "Percent of the lot covered by buildings, and percent usable open area (lawn, driveways)",
  "Total construction cost (building construction only; the form excludes purchase price, site work, equipment, furniture, sprinklers, plumbing and HVAC)",
  "A site plan drawn to scale showing every building, the sewage disposal system, driveways and turnarounds, and abutting lot and street lines, with distances to each property line",
]
survey_note = "If a property line is in doubt, the Code Enforcement Officer may ask for a boundary survey or mortgage inspection plan."
inspections = "The building permit form calls for at least three inspections: foundation, framing before it is covered, and a final before occupancy. A permit is void if work does not start within six months."

# ------------------------------------------------------------------ checklists (A1)
# `patterns` are case-insensitive regular expressions matched against the
# question. When several topics match, the one with more matching patterns
# wins; a tie goes to the topic listed first, so specific topics come first.

[[checklist]]
id = "conversion"
title = "Converting a building to three or more units"
summary = "Adding units to an existing house or building, up to three or beyond."
patterns = [
  '\b(three|four|five|six|3|4|5|6)[- ]?(unit|units|family|apartments?|dwelling units)\b',
  '\btriplex\b',
  '\bmulti-?family\b',
  '\bconvert\w*\b.{0,40}\b(apartments?|units?)\b',
  '\b(add|adding|create|creating|another)\b.{0,25}\b(apartment|dwelling unit|unit)\b',
]
bring_building = true
forms = ["building", "change_of_use", "life_safety"]
bring = [
  "Floor plans of each unit, existing and proposed",
  "The number of units now and after the work, and the parking you will provide",
  "Lot area, so the office can check the minimum land per dwelling unit for your zone",
]
notes = [
  "In the R-A zone and the zones that allow its uses, the Code Enforcement Officer may approve conversions of existing buildings to create as many as three units, if the conversion is not a subdivision. Larger projects go to the Planning Board.",
  "A change of occupancy calls for the Fire Department's General Life Safety Review. Ask whether your conversion counts as one.",
]
fire_review = "likely"

[[checklist.sections]]
citation = "§ 275-5.1B(4)"
url = "https://ecode360.com/38457195"
says = "New multifamily dwellings and conversions follow § 275-4.20 and Chapter 244. The Code Enforcement Officer may approve conversions of existing buildings to create as many as three units, if those conversions do not constitute subdivisions."

[[checklist.sections]]
citation = "§ 275-4.20"
url = "https://ecode360.com/38456786"
says = "Multifamily developments (three or more dwelling units) may be authorized by the Planning Board, with minimum land per dwelling unit, frontage and setbacks set by district."

[[checklist.sections]]
citation = "§ 275-6.4"
url = "https://ecode360.com/38457736"
says = "Site plan review by the Planning Board: which projects need it and which are exempt."

[[checklist]]
id = "short_term_rental"
title = "Short-term rental"
summary = "Renting a dwelling unit or rooms for stays of less than 30 days."
patterns = [
  '\bshort[- ]term rentals?\b',
  '\bair ?bnb\b',
  '\bvrbo\b',
  '\bvacation rentals?\b',
  '\brent\w*\b.{0,30}\b(nightly|by the night|weekends?)\b',
]
bring_building = false
forms = []
bring = [
  "The address, and whether you live there full time (owner-occupied) or not",
  "The number of rental rooms and the size of each (each must be at least 120 square feet)",
  "Where guests will park (at least one space for each rental room)",
  "For a non-owner-occupied rental: the license fee of $120, paid before the City Clerk issues the license",
]
notes = [
  "Short-term rentals are allowed in all residential zones except the Residential-A zone. Short-term rental of an accessory dwelling unit is prohibited in all residential zones.",
  "No short-term rental form is posted online. Ask the City Clerk for the license application and the Fire Department for the inspection.",
]
fire_review = "no"

[[checklist.sections]]
citation = "§ 275-4.35"
url = "https://ecode360.com/38457184"
says = "Not allowed in the Residential-A zone. At least one parking space for each rental room; each rental room at least 120 square feet. A non-owner-occupied rental needs a Fire Department inspection under NFPA 101 and an annual license; the license fee is $120."

[[checklist]]
id = "home_occupation"
title = "Home occupation (business at home)"
summary = "Running a business from your dwelling unit."
patterns = [
  '\bhome occupations?\b',
  '\bhome[- ]based business\b',
  '\bhome business\b',
  '\bbusiness\b.{0,30}\b(from|out of|at|in)\b.{0,10}\b(my|our|the)\b.{0,10}\b(home|house|apartment)\b',
  '\b(salon|daycare|day care|bakery|workshop)\b.{0,30}\b(home|house)\b',
]
bring_building = false
forms = []
bring = [
  "A description of the business, its hours and how many people will work in it (no more than two, including the owner)",
  "The floor area used for the business and the floor area of the dwelling unit (no more than 500 square feet or 25%, whichever is less)",
  "Where clients will park (side or rear yard, not the front yard)",
  "The size and placement of any sign (one sign, no larger than five by 24 inches, affixed to the home)",
  "An operable fire extinguisher in the business area; the Fire Department inspects before the permit",
]
notes = [
  "A business conducted by an occupant, with no regular client or delivery visits and no sign, is not treated as a special exception under § 275-4.16A(2). Ask the office whether your business fits that description before you rely on it.",
  "Where a home occupation needs approval, the Code Enforcement Officer decides it as a special exception after notice to neighbors (§ 275-5.20).",
  "No home occupation form is posted online. Ask the office which application to file.",
]
fire_review = "no"

[[checklist.sections]]
citation = "§ 275-4.16"
url = "https://ecode360.com/38456708"
says = "Not more than two persons, including the owner. Not more than 500 square feet or 25% of the floor area of the dwelling unit, whichever is less. One sign, no larger than five inches by 24 inches, affixed to the home. Fire Department inspection before the permit; an operable fire extinguisher in the business area."

[[checklist.sections]]
citation = "§ 275-5.20"
url = "https://ecode360.com/38457601"
says = "Special exceptions: the notice and decision process the Code Enforcement Officer follows."

