[forms.building]
title = "Building Permit Application"
url = "https://www.waterville-me.gov/DocumentCenter/View/1336/Building-Permit-Application-PDF"
who = "Code Enforcement"

[forms.change_of_use]
title = "Change of Use or Owner Permit Application"
url = "https://www.waterville-me.gov/DocumentCenter/View/1337/Change-of-Use-Owner-Permit-Application-PDF"
who = "Code Enforcement"

[forms.electrical]
title = "Electrical Permit Application"
url = "https://www.waterville-me.gov/DocumentCenter/View/1419/Electrical-Permit-Application-PDF"
who = "Municipal Electrical Inspector (one- and two-family homes)"

[forms.electrical_service]
title = "Electrical Service Connection Application"
url = "https://www.waterville-me.gov/DocumentCenter/View/1338/Electrical-Service-Connection-ApplicationPDF"
who = "Code Enforcement"

[forms.plumbing]
title = "Plumbing Permit Application"
url = "https://www.waterville-me.gov/DocumentCenter/View/247/Plumbing-Permit-Application-PDF"
