# ------------------------------------------------------------------ fees (A4)
# Published formulas only. Building permit fees: § 127-3A points to a fee
# schedule "available from the City offices and/or on the City website"; no
# such schedule was found online on 2026-10-03.

[fees]
building_note = "The building permit fee schedule is not published online. Section 127-3A says fees are set in a schedule available from the City offices. Call Code Enforcement at 207-680-4208 for the building permit fee."
building_quote = "Fees are as provided for in the Maine Uniform Building and Energy Code (MUBEC) and as set forth in the fee schedule available from the City offices and/or on the City website."
building_citation = "§ 127-3A"
building_url = "https://ecode360.com/38454336"
after_the_fact = "Permits applied for after work has started may be charged double the amount of the fee, subject to a maximum of $500. Failure to acquire a permit within 30 calendar days of a violation notice increases the fee to $1,000 (§ 127-3B for building permits, § 127-10B for electrical permits)."

[fees.life_safety]
title = "General Life Safety Review (Fire Department)"
rate = "0.0015"
source = "General Life Safety Review form, page 3"
source_url = "https://www.waterville-me.gov/DocumentCenter/View/904/General-Life-Safety-Review-PDF"
formula = "1.5% of 1/10 of the cost of construction (multiplier of 0.0015). Example on the form: $100,000 x 0.0015 = $150."
excludes = "The cost counts only the building and the parts of it the State Fire Marshal's Office generally reviews. It leaves out purchase price, site work, equipment, furniture, sprinkler systems, plumbing and HVAC (unless part of a smoke removal system). Solar projects may include the cost of equipment being installed."

[fees.electrical]
title = "Electrical permit (one- and two-family homes)"
source = "Electrical Permit Application"
source_url = "https://www.waterville-me.gov/DocumentCenter/View/1419/Electrical-Permit-Application-PDF"
scope = "The Municipal Electrical Inspector permits electrical work at single-family and two-family occupancies (§ 127-9, § 127-10A). Other electrical work is permitted under state law."
minimum_note = "The form lists a minimum fee for each occupancy. It does not say whether the minimum is added to the line items or is a floor; this estimate treats it as a floor. The office confirms the fee."

