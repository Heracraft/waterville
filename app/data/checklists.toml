# Public permit tools (A1, A3, A4): permit-type checklists, the permit
# router and the published fee formulas. Read by app/routers/checklists.py.
#
# Sources, checked 2026-10-03:
#   City Code text in output/markdown/code/ (eCode360, legislation through
#   08-05-2026). Section URLs come from output/chunks.jsonl.
#   City forms listed on https://waterville-me.gov/225/Building-Permit-Applications
#   (Building Permit Application, Change of Use or Owner, Electrical Permit,
#   Electrical Service Connection, Plumbing Permit, Sign, Subsurface
#   Wastewater) and the Fire Department's General Life Safety Review form
#   (DocumentCenter/View/904).
#
# Rules for every entry, from docs/inspector-workflow.md section 4(a):
#   - Never say a permit is not needed. Say what the sources require and send
#     the rest to the office.
#   - End with the confirm line.
#   - `says` lines carry figures exactly as the code states them.
#
# Prose follows the project's writing rules: no em dashes.

checked = "2026-10-03"
office = "Code Enforcement Office, 7 College Avenue, Waterville"
office_phone = "207-680-4208"
office_hours = "Monday to Thursday, 7:00 a.m. to 5:00 p.m."
confirm_line = "Confirm with Code Enforcement (207-680-4208) before you build."
applications_page = "https://waterville-me.gov/225/Building-Permit-Applications"
tax_map_page = "https://waterville-me.gov/316/Online-Services"

