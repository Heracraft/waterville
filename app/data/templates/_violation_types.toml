# Shared text blocks for enforcement templates (notices of violation,
# stop-work order, Rule 80K packet and memo). A template that sets
# `shared = ["_violation_types.toml"]` gets the fields below in its form and
# these placeholders from the picked `violation_type`: {chapter},
# {duty_line}, {penalty_text}, {tier_summary}, {appeal_text}, {cc_required},
# {mortgagee_block}, {attest_sections}, {notify_check},
# {prior_conviction_text}. {appeal_text} uses
# {appeal_by_long} and the building variants use {atf_by_long}, so the
# template must compute appeal_by and atf_by.
#
# Sources checked on 2026-10-03:
#   Code of the City of Waterville, output/markdown/code/ (legislation through 08-05-2026):
#     § 275-6.1A(1), (3)(a)-(d); § 275-6.2E(1), H(2); § 205-7, § 205-8;
#     § 127-3B, § 127-5A, § 127-7; § 5-2.10B.
#   30-A M.R.S. § 4452(3)(A), (B), (B-1), (C), (D), (F): legislature.maine.gov.
#   30-A M.R.S. § 2691(4): legislature.maine.gov.
# Anything not found in those texts carries a visible [VERIFY] tag.

[[fields]]
name = "violation_type"
label = "Ordinance and violation type"
kind = "select"
required = true
section = "Violation"
help = "Picks the enforcement section, the penalty tier under 30-A M.R.S. § 4452(3) and the appeal language."
options = [
  { value = "zoning_no_permit", label = "Zoning (Ch. 275): work or land use activity without a required permit" },
  { value = "zoning_specific", label = "Zoning (Ch. 275): other specific violation" },
  { value = "zoning_rp", label = "Zoning (Ch. 275): violation in a shoreland Resource Protection District" },
  { value = "property_maintenance", label = "Property maintenance (Ch. 205)" },
  { value = "building_no_permit", label = "Building code (Ch. 127, MUBEC): work without a required permit" },
  { value = "building_specific", label = "Building code (Ch. 127, MUBEC): other specific violation" },
]

[[fields]]
name = "mortgagee_name"
label = "Mortgagee"
kind = "text"
section = "Violation"
required_when = { violation_type = ["property_maintenance"] }
help = "Chapter 205 notices go to the owner and the mortgagee (§ 205-7). Take the mortgagee from the registry of deeds."

[[fields]]
name = "mortgagee_address"
label = "Mortgagee mailing address"
kind = "textarea"
rows = 2
section = "Violation"
required_when = { violation_type = ["property_maintenance"] }

# ------------------------------------------------------------------ zoning

[variants.violation_type.zoning_no_permit]
chapter = "Chapter 275 (Zoning)"
duty_line = "Section 275-6.1A(1) of the City Code directs the Code Enforcement Officer to notify the person responsible for a violation in writing, state the nature of the violation and order the action necessary to correct it, including discontinuance of any illegal work."
penalty_text = "Under § 275-6.1A(3)(d) of the City Code and 30-A M.R.S. § 4452(3)(A), the minimum penalty for starting construction or undertaking a land use activity without a required permit is $100 and the maximum penalty is $2,500. Under § 275-6.1A(3)(b), after notification of a violation, each day that the violation exists constitutes a separate offense."
tier_summary = "30-A M.R.S. § 4452(3)(A): $100 minimum, $2,500 maximum"
notify_check = "City Solicitor and City Council notified of the violation, as § 275-6.1A(3)(a) requires; the City, acting through the City Council, may institute proceedings"
appeal_text = "You may appeal this notice and order to the Waterville Zoning Board of Appeals. Under § 275-6.2E(1) of the City Code, an appeal must be made within 30 days of the decision of the Code Enforcement Officer, which for this notice is by {appeal_by_long}, and the Board hears the appeal de novo. File the appeal with the Code Enforcement Office; the fee is $25 plus the cost of advertising (§ 275-6.2H(2)). Under 30-A M.R.S. § 2691(4), a notice of violation or an enforcement order by a code enforcement officer under a land use ordinance is reviewable on appeal by the board of appeals, and a decision that is not timely appealed is subject to the same preclusive effect as otherwise provided by law."
cc_required = "City Solicitor and City Council, as § 275-6.1A(3)(a) requires"
mortgagee_block = ""
attest_sections = "Chapter 275, Zoning, the sections cited above and § 275-6.1"
prior_conviction_text = "Because a previous conviction of the same party within the past two years for a violation of the same law or ordinance has been shown, the fine may reach a maximum of $25,000 (§ 275-6.1A(3)(b) of the City Code; see also 30-A M.R.S. § 4452(3)(F)). [VERIFY: 30-A M.R.S. § 4452(3)(F) raises only the maximums of paragraphs B and B-1, and this violation falls under paragraph A. The $25,000 figure rests on § 275-6.1A(3)(b), which applies unless a different penalty is provided in Chapter 275, and § 275-6.1A(3)(d) sets $2,500 for work without a permit.]"

