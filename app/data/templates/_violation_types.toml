# ------------------------------------------------------------------ Ch. 205

[variants.violation_type.property_maintenance]
chapter = "Chapter 205 (Property Maintenance)"
duty_line = "Section 205-7 of the City Code directs the Code Enforcement Officer to notify the property owner and mortgagee of a violation by written notice served by mail or by hand delivery, explaining the nature of the violation and setting a deadline for correcting it. A copy of this notice goes to the mortgagee."
penalty_text = "A person who violates Chapter 205 commits a civil violation punishable by a civil penalty of $100, which may not be suspended. Each day the violation continues beyond the correction period set in this notice is a separate violation (§ 205-8). The City may also pursue all remedies and relief provided in 30-A M.R.S. § 4452. If the corrective action is not taken within the time allowed, the Code Enforcement Officer may have it taken and recover the cost in a civil action, and if the City is the prevailing party it shall be awarded its reasonable attorney fees (§ 205-8)."
tier_summary = "§ 205-8: $100 per day beyond the correction period, not suspendable; plus 30-A M.R.S. § 4452 remedies"
notify_check = "City Solicitor consulted on whether the City Solicitor or the enforcement official will prosecute (80K Manual 2017, p. 19)"
appeal_text = "Chapter 205 does not name a board that hears appeals of this notice or a deadline for an appeal. Under 30-A M.R.S. § 2691(4), a notice of violation by a code enforcement officer under a land use ordinance is reviewable on appeal by the board of appeals, but a board may hear only the subject matter that a charter or ordinance specifies. [VERIFY: whether Chapter 205 is a land use ordinance for § 2691(4), which board hears the appeal, and the deadline. The 30-day period below is taken from § 275-6.2E(1), which governs zoning decisions.] If an appeal is available, file it with the Code Enforcement Office within 30 days of the date of this notice, by {appeal_by_long}."
cc_required = "Mortgagee: {mortgagee_name}, {mortgagee_address} (§ 205-7)"
mortgagee_block = "Mortgagee (copy sent as § 205-7 requires):\n{mortgagee_name}\n{mortgagee_address}"
attest_sections = "Chapter 205, Property Maintenance, the sections cited above and §§ 205-7 and 205-8"
prior_conviction_text = "[VERIFY: a prior conviction was marked, but § 205-8 sets a flat civil penalty of $100, and 30-A M.R.S. § 4452(3)(F) raises only the maximums of paragraphs B and B-1. Delete this line unless the City Solicitor confirms a higher penalty applies.]"

# ------------------------------------------------------------------ Ch. 127

[variants.violation_type.building_no_permit]
chapter = "Chapter 127 (Building and Energy Code)"
duty_line = "Section 127-5A of the City Code directs the Code Enforcement Officer to issue the notices or orders necessary to enforce compliance with law, remove illegal or unsafe conditions and secure the necessary safeguards during construction. Section 127-2A requires a permit before the start of any construction, alteration, removal or demolition of a building or structure."
penalty_text = "Penalties for violations of the Maine Uniform Building and Energy Code are the civil penalties provided in 30-A M.R.S. § 4452(3) (§ 127-7). The minimum penalty for starting construction without a required permit is $100 and the maximum penalty is $2,500 (30-A M.R.S. § 4452(3)(A)), and monetary penalties may be assessed on a per-day basis (§ 4452(3)). A permit applied for after work has started may be charged double the fee, subject to a maximum of $500. If a permit is not obtained within 30 calendar days of this violation notice, by {atf_by_long}, that fee increases to $1,000 (§ 127-3B)."
tier_summary = "30-A M.R.S. § 4452(3)(A): $100 minimum, $2,500 maximum (via § 127-7)"
notify_check = "City Solicitor consulted on whether the City Solicitor or the enforcement official will prosecute (80K Manual 2017, p. 19)"
appeal_text = "Chapter 127 does not name a board that hears appeals of this notice or a deadline for an appeal. Under 30-A M.R.S. § 2691(4), a board of appeals may hear only the subject matter that a charter or ordinance specifies. [VERIFY: the appeal route and deadline for building code orders under Chapter 127 and the Maine Uniform Building and Energy Code. The likely route is 30-A M.R.S. § 4103(5): \"An appeal may be taken from any order issued by the building official, or from the licensing authority's refusal to grant a permit, to the municipal officers or to a board of appeals established under section 2691.\" 30-A M.R.S. § 4101 applies that subchapter to any municipal ordinance requiring a permit in connection with the construction, demolition, improvement or alteration of any building, and § 127-2 requires a building permit. Section 4103(5) sets no deadline. The 30-day period below is taken from § 275-6.2E(1), which governs zoning decisions.] If an appeal is available, file it with the Code Enforcement Office within 30 days of the date of this notice, by {appeal_by_long}."
cc_required = ""
mortgagee_block = ""
attest_sections = "Chapter 127, Building and Energy Code, §§ 127-1, 127-2 and 127-7"
prior_conviction_text = "[VERIFY: a prior conviction was marked, but 30-A M.R.S. § 4452(3)(F) raises only the maximums of paragraphs B and B-1, and work without a permit falls under paragraph A ($2,500). Delete this line unless the City Solicitor confirms a higher penalty applies.]"

